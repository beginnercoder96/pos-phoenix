{{define "login.html"}}<!doctype html><html lang="{{.Language}}" data-theme="{{.Theme}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{label .Language "signIn"}} · POS Phoenix</title><link rel="stylesheet" href="/static/css/app.css"><script defer src="/static/js/app.js"></script></head><body class="app-body login-backdrop"><main class="mx-auto flex min-h-screen max-w-md items-center p-5"><section class="surface w-full overflow-hidden shadow-xl sm:p-2"><div class="rounded-2xl bg-[#172033] p-6 text-white sm:p-8"><div class="flex items-center gap-3"><img src="/static/img/logopardis.jpg" alt="Pardis Barber Shop" class="h-11 w-11 rounded-xl object-cover shadow-lg"><div><p class="font-black tracking-tight">Pardis Barber Shop</p><p class="text-xs text-slate-300">A place where the nice haircut trim come from us!</p></div></div></div><div class="p-6 sm:p-8"><form method="post" action="/preferences" class="mb-8 flex justify-end gap-2" data-auto-submit><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="return_to" value="/login"><select name="language" class="preference-select" aria-label="{{label .Language "language"}}"><option value="en" {{if eq .Language "en"}}selected{{end}}>EN</option><option value="id" {{if eq .Language "id"}}selected{{end}}>ID</option></select><select name="theme" class="preference-select" aria-label="{{label .Language "theme"}}"><option value="light" {{if eq .Theme "light"}}selected{{end}}>☀</option><option value="dark" {{if eq .Theme "dark"}}selected{{end}}>☾</option></select><noscript><button type="submit">{{label .Language "save"}}</button></noscript></form><p class="eyebrow">{{label .Language "appName"}}</p><h1 class="mt-2 text-3xl font-black">{{label .Language "welcome"}}</h1><p class="muted mt-2">{{label .Language "secureCashflow"}}</p>{{if .Error}}<div role="alert" class="mt-5 rounded-xl bg-red-950 p-3 text-red-200">{{.Error}}</div>{{end}}<form method="post" action="/login" class="mt-6 space-y-4"><input type="hidden" name="csrf" value="{{.CSRF}}"><label class="block"><span class="field-label">{{label .Language "email"}}</span><input class="field" type="email" name="email" autocomplete="username" required></label><label class="block"><span class="field-label">{{label .Language "password"}}</span><input class="field" type="password" name="password" autocomplete="current-password" required></label><button class="btn-primary w-full" type="submit">{{label .Language "signIn"}}</button></form></div></section></main></body></html>{{end}}
